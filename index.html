<style>
:root{--bg:#fbfaf7;--fg:#1c1d20;--bar:#eceae4;--bd:#d6d3ca;--g:#15803d;--y:#a16207;--b:#1d4ed8;--w:#1c1d20;--r:#dc2626;--ac:#0b6e6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#e6e6e0;--bar:#1e2127;--bd:#32363e;--g:#4ade80;--y:#facc15;--b:#60a5fa;--w:#fff;--r:#ff5252;--ac:#5eead4}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e6e6e0;--bar:#1e2127;--bd:#32363e;--g:#4ade80;--y:#facc15;--b:#60a5fa;--w:#fff;--r:#ff5252;--ac:#5eead4}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
#top{display:flex;background:var(--bar);border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}

#tabs{display:flex;background:var(--bar);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.tb{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 6px 8px 12px;font-size:13px;border-right:1px solid var(--bd);opacity:.6;white-space:nowrap}
.tb.a{opacity:1;background:var(--bg);box-shadow:inset 0 -2px var(--ac)}
.tb b{font-weight:400;padding:0 6px;font-size:16px}

#fb.s{display:flex}#fb input{flex:1;min-width:0;padding:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:6px;font-size:16px}

#wrap{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}

.ln{min-height:1.55em}.ln.gl{color:var(--w)}.ln.g{color:var(--g)}.ln.y{color:var(--y)}.ln.b{color:var(--b)}.ln.r{color:var(--r)}.ln.gl{text-shadow:0 0 6px currentColor,0 0 16px currentColor}

.im i,.im b{display:none}.im.sl{outline:2px solid var(--ac)}

#sc{position:fixed;inset:0;background:#0006;z-index:25;display:none}#sc.o{display:block}
#sp{display:none;position:fixed;right:8px;z-index:20;width:250px;padding:14px;background:var(--bar);border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 18px #0005}

.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{border-color:var(--ac);color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;z-index:40;pointer-events:none;max-width:90%}
#toast.s{opacity:1}
.tg{display:flex;align-items:center;gap:0;margin:.1em 0;padding:0;border-radius:8px;border-left:3px solid currentColor;background:color-mix(in srgb,currentColor 10%,transparent);cursor:pointer;user-select:none;-webkit-user-select:none}.tg:active{background:color-mix(in srgb,currentColor 20%,transparent)}
.tg b{font-weight:600}.tg .ar{display:grid;place-items:center;width:56px;height:26px;flex:none}.tg:after{content:"";width:56px;flex:none}.tg .ar svg{width:18px;height:18px;stroke-width:2.8;transition:transform .15s;transform:rotate(90deg)}.tg .nm{margin:0 auto;padding:0 12px;font-size:.95em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg.c .ar svg{transform:none}
.tx{display:block;margin-left:13px;padding-left:14px;border-left:2px solid color-mix(in srgb,currentColor 28%,transparent)}.tx:empty{display:none}
#ol{display:none;position:fixed;left:0;right:0;bottom:0;height:46vh;z-index:22;flex-direction:column;background:var(--bar);border-top:1px solid var(--bd);box-shadow:0 -4px 18px #0005;padding-bottom:env(safe-area-inset-bottom,0px)}#ol.o{display:flex}
.oh{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 16px;font-size:13px;letter-spacing:.05em;height:46px;flex:none}.oh span{opacity:.7}
#ol-l{flex:1;overflow:auto}.or{display:flex;align-items:center;height:48px;border-top:1px solid var(--bd)}
.or .oN{flex:1;display:flex;align-items:center;gap:12px;padding:0 16px;height:100%;font-size:16px;min-width:0}.or .oN span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.or .ev{flex:0 0 60px;height:100%;background:none;border:0;color:var(--fg);display:grid;place-items:center}.or.h .oN{opacity:.5}.or.h .ev{color:var(--ac)}
.of{flex:none;padding:8px;border-top:1px solid var(--bd)}.of button{width:100%;padding:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:8px;font-size:15px}.of button:disabled{opacity:.4}.oe{padding:20px 16px;opacity:.6;font-size:14px}
@keyframes fl{from{background:color-mix(in srgb,var(--ac) 35%,transparent)}to{background:transparent}}.ln.fl{animation:fl 1.2s}
.tg.c+.tx{display:none}.ln.hid{display:none}.ln.tbd{margin-left:13px;padding-left:14px;border-left:2px solid color-mix(in srgb,currentColor 28%,transparent)}
</style></head><body>

<script>
const $=id=>document.getElementById(id),ed=$('ed'),wrap=$('wrap'),ov=$('ov');
const FONTS=['Inter','Roboto','Lora','Merriweather','Playfair Display','Fira Code','Caveat','Pacifico','Oswald','Space Mono','Lobster','Anton'];
function pfx(r){const u={},n={};let i=0;while(i<r.length&&'#>^'.includes(r[i])&&!u[r[i]]){const c=r[i];let j=i;while(r[j]===c)j++;u[c]=1;n[c]=j-i;i=j}if(!i)return{l:0,c:''};if(r[i]===' ')i++;const k=Math.min(n['>']||0,4),h=Math.min(n['#']||0,2),q=n['^']||0;return{l:i,c:(h?'h'+h+' ':'')+(['','g','y','b','r'][k]||(q>1?'r':''))+(q?' gl':'')}}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const cls=r=>pfx(r).c;
const inl=b=>esc(b).replace(/\{([^|{}]+)\|([^{}]*)\}/g,'<span style="font-family:\'$1\'">$2</span>').replace(/\*([^*]+)\*/g,'<b>$1</b>').replace(/_([^_]+)_/g,'<i>$1</i>');
const render=r=>inl(r.slice(pfx(r).l));
const strip=r=>{const p=pfx(r),b=r.slice(p.l);return p.c?b.replace('<',''):b};const plain=r=>strip(r).replace(/\{[^|{}]+\|([^{}]*)\}/g,'$1').replace(/\*([^*]+)\*/g,'$1').replace(/_([^_]+)_/g,'$1');
/* tabs: ||text|| or ||^name::text|| (^ = closed); multi-line ends with a line ending in || */
const ONE=/\|\|\s*$/;
function th(raw){const p=pfx(raw),b=raw.slice(p.l);let s,col='',name='',m=b.match(/^∆(\^?)([^∆\n]*)∆\|\|/);if(m){col=m[1];name=m[2];s=b.slice(m[0].length)}else if(b.slice(0,2)==='||'){s=b.slice(2);m=s.match(/^(\^?)([^:\n]*?)::/);if(m){col=m[1];name=m[2];s=s.slice(m[0].length)}}else return null;return{p,col,name,s,one:ONE.test(s)}}
function roles(R){let o=null;return R.map(raw=>{if(o){const e=ONE.test(raw),n={r:e?'e':'b',c:o.c,col:o.col};n.k='b'+n.r+n.c+n.col;if(e)o=null;return n}const t=th(raw);if(!t)return{r:'',k:''};if(t.one)return{r:'s',t,k:'s'};o={c:t.p.c.replace(/h\d ?/,'').trim(),col:t.col};return{r:'h',t,k:'h'}})}
const tg=t=>'<span class="tg'+(t.col?' c':'')+'"><b class="ar"><svg class="i"><use href="#chev"/></svg></b><b class="nm">'+(esc(t.name)||'unnamed')+'</b></span>';
function kls(raw,act,n){const b=n.r==='b'||n.r==='e';let c=act?cls(raw):split(raw,n).c;if(!c&&b)c=n.c;return 'ln '+c+(b?' tbd':'')+(b&&n.col?' hid':'')+(act?'':' rd')}
function scan(){const L=[...ed.children],rd=l=>l.classList.contains('rd'),R=roles(L.map(l=>rd(l)?l.dataset.raw:l.textContent));L.forEach((l,i)=>{const n=R[i],o=l._r||{r:'',k:''};l._r=n;if(rd(l)){if(o.k!==n.k||o.r!==n.r)setLine(l,l.dataset.raw,false)}else l.className=kls(l.textContent,true,n)})}
function ptx(rs){const R=roles(rs);return rs.map((l,i)=>{const n=R[i],t=(n.r==='s'||n.r==='h')&&th(l);if(t){const x=t.one?t.s.replace(ONE,''):t.s;return '['+(t.name||'unnamed')+']'+(x?'\n'+plain(x):'')}return plain(n.r==='e'?l.replace(ONE,''):l)}).join('\n')}
function split(r,n){n=n||{r:''};const p=pfx(r);let b=r.slice(p.l);if(n.r==='e')b=b.replace(ONE,'');const t=(n.r==='s'||n.r==='h')&&th(r);if(t)return{c:p.c,w:1,h:tg(t)+'<span class="tx">'+inl(t.one?t.s.replace(ONE,''):t.s)+'</span>'};const i=p.c?b.indexOf('<'):-1;return i<0?{c:p.c,h:inl(b),w:1}:{c:'',h:'<span class="ln '+p.c+'">'+inl(b.slice(0,i))+'</span>'+inl(b.slice(i+1)),w:0}}
function setLine(el,raw,act){const n=el._r||{r:''};el.className=kls(raw,act,n);el.dataset.raw=raw;if(act)el.textContent=raw;else el.innerHTML=split(raw,n).h||'<br>'}
const mk=(raw,n)=>{const d=document.createElement('div');d._r=n||{r:''};setLine(d,raw,false);return d};
const getRaw=()=>[...ed.children].map(l=>l.classList.contains('rd')?l.dataset.raw:l.textContent).join('\n');
function setRaw(t){ed.textContent='';const f=document.createDocumentFragment();const L=t.split('\n'),R=roles(L);L.forEach((l,i)=>f.appendChild(mk(l,R[i])));ed.appendChild(f)}
const lineOf=n=>{while(n&&n.parentNode!==ed)n=n.parentNode;return n&&n.nodeType===1?n:null};
let tabs=[],cur=0,sel=null,dir=null,hot=false,theme='',toastT;
const T=()=>tabs[cur];
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('s');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('s'),2200)}
/* history */
let sT;function snap(){const t=T(),r=getRaw();if(r!==t.h[t.i]){t.h.length=t.i+1;t.h.push(r);if(t.h.length>150)t.h.shift();t.i=t.h.length-1}}
function hist(d){snap();const t=T(),n=t.i+d;if(n<0||n>=t.h.length)return;t.i=n;setRaw(t.h[n])}
/* tabs */
function newTab(n,raw,imgs){tabs.push({n:n||'Untitled '+(tabs.length+1),raw:raw||'',imgs:imgs||[],h:[raw||''],i:0});sw(tabs.length-1)}
function sw(i){if(tabs[cur]&&cur!==i&&ed.firstChild)tabs[cur].raw=getRaw();cur=i;setRaw(T().raw);sel=null;draw();drawTabs()}
function drawTabs(){const b=$('tabs');b.innerHTML='';tabs.forEach((t,i)=>{const d=document.createElement('div');d.className='tb'+(i===cur?' a':'');d.innerHTML='<span></span><b>×</b>';d.firstChild.textContent=t.n;d.firstChild.onclick=()=>{if(i!==cur)sw(i)};d.firstChild.ondblclick=()=>{const n=prompt('Rename tab',t.n);if(n){t.n=n;drawTabs()}};d.lastChild.onclick=()=>closeTab(i);b.appendChild(d)});const a=document.createElement('button');a.className='ib';a.style.height='34px';a.innerHTML='<svg class="i"><use href="#plus"/></svg>';a.onclick=()=>newTab();b.appendChild(a)}
function closeTab(i){if(i===cur)tabs[cur].raw=getRaw();tabs.splice(i,1);if(!tabs.length){cur=0;newTab();return}cur=Math.min(i<cur?cur-1:cur,tabs.length-1);setRaw(T().raw);sel=null;draw();drawTabs()}
/* live line rendering */
document.addEventListener('selectionchange',()=>{const s=getSelection();if(!s.rangeCount||!ed.contains(s.anchorNode))return;
if(!s.isCollapsed||!editing)return;const el=lineOf(s.anchorNode);if(!el)return;
const r=document.createRange();r.selectNodeContents(el);r.setEnd(s.anchorNode,s.anchorOffset);const off=r.toString().length;
[...ed.children].forEach(l=>{if(l!==el&&!l.classList.contains('rd'))setLine(l,l.textContent,false)});
if(el.classList.contains('rd')){const raw=el.dataset.raw,p=pfx(raw).l;setLine(el,raw,true);const n=el.firstChild;if(n){const c=document.createRange();c.setStart(n,Math.min(off+p,raw.length));c.collapse(true);s.removeAllRanges();s.addRange(c)}else{const c=document.createRange();c.setStart(el,0);c.collapse(true);s.removeAllRanges();s.addRange(c)}}});
ed.addEventListener('input',()=>{if(!ed.firstChild)ed.innerHTML='<div class="ln"><br></div>';const s=getSelection();const el=lineOf(s.anchorNode);
if(el){if(el.classList.contains('rd')){const r=el.textContent;setLine(el,r,true);const c=document.createRange();if(el.firstChild){c.setStart(el.firstChild,r.length)}else c.setStart(el,0);c.collapse(true);s.removeAllRanges();s.addRange(c)}el.className=kls(el.textContent,true,el._r||{r:''})}
scan();clearTimeout(sT);sT=setTimeout(snap,400);if(hot)hotSave()});
ed.addEventListener('keydown',e=>{if(e.key==='Backspace'||e.key==='Delete'){const el=lineOf(getSelection().anchorNode);if(!el)return;[el.previousElementSibling,el.nextElementSibling].forEach(n=>{if(n&&n.classList.contains('rd'))setLine(n,n.dataset.raw,true)})}});
ed.addEventListener('paste',e=>{e.preventDefault();const L=(e.clipboardData.getData('text/plain')||'').split(/\r?\n/);L.forEach((l,i)=>{if(i)document.execCommand('insertParagraph');if(l)document.execCommand('insertText',false,l)})});
ed.addEventListener('pointerdown',()=>{if(sel){sel=null;draw()}});
ed.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('.tg');if(!g)return;e.preventDefault();const el=lineOf(g);if(!el||!el.classList.contains('rd'))return;const raw=el.dataset.raw,t=th(raw);if(!t)return;let c=t.col?'':'^',nm=t.name;setLine(el,raw.slice(0,t.p.l)+((c||nm)?'∆'+c+nm+'∆':'')+'||'+t.s,false);scan();snap();if(hot)hotSave()});
